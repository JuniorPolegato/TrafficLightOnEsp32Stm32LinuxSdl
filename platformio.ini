[platformio]
;default_envs = t-display
build_cache_dir = .pio/cache

; ---------- ESP32 (ESP-IDF) ----------
[esp_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
board_build.extra_flags =
build_flags =
extra_scripts = pre:enable_ccache.py
lib_ignore = FreeRTOS-Kernel, lvgl          ; IDF provides its own FreeRTOS + LVGL

[env:t-display]
extends = esp_common
board = lilygo-t-display

[env:t-display_s3]
extends = esp_common
board = esp32-s3-devkitc-1

; ---------- PC simulator (FreeRTOS POSIX + SDL2) ----------
[env:native]
platform = native
lib_deps =
    lvgl/lvgl@^9.2
    FreeRTOS-Kernel
build_flags =
    -DSIMULATOR
    -DLV_CONF_INCLUDE_SIMPLE
    -Isim
    -lSDL2 -lpthread
extra_scripts = pre:freertos_port.py

[h7_common]
platform = ststm32
framework = stm32cube
lib_deps =
    lvgl/lvgl@^9.2
    FreeRTOS-Kernel
build_unflags = -DSTM32H753xx
build_flags =
    -DSTM32H755xx
    -DCORE_CM7
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Istm32
lib_ldf_mode = deep+
extra_scripts = pre:freertos_port.py

; Renode
[env:h755_renode]
extends = h7_common
board = nucleo_h753zi

; Real NUCLEO-H755ZI-Q (CM7 core)
[env:h755]
extends = h7_common
board = nucleo_h753zi
board_build.mcu = stm32h755zit6
board_upload.maximum_size = 1048576     ; CM7 = flash bank 1 only
build_flags =
    ${h7_common.build_flags}
    -DBOARD_H755
upload_protocol = stlink
debug_tool = stlink
